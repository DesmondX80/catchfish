# Ikkunattomat testit Godot 4.7.2:lla jokaisesta pushista ja PR:stä.
# Samat testit paikallisesti: tools/run_tests.sh [/polku/godotiin]
name: Testit

on:
  push:
    branches: ['**'] # ei tageista: release-tagin commit on jo testattu mainissa
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Testiajurin itsetesti
        run: tools/run_tests_selftest.sh

      - name: Godot välimuistista
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Lataa Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          rm godot.zip

      - name: Tuo projekti
        run: ~/godot-bin/godot --headless --import || true

      - name: Aja testit
        run: tools/run_tests.sh ~/godot-bin/godot
