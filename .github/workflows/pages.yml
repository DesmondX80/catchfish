# Selainversio GitHub Pagesiin: Godotin web-vienti jokaisesta julkaisusta
# (tai käsin Actions-välilehdeltä). Peli: https://desmondx80.github.io/catchfish/
name: GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot ja web-vientipohja välimuistista
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Lataa Godot ja web-vientipohja
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sL -o godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sL -o templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q -j templates.tpz templates/web_nothreads_release.zip templates/version.txt \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm godot.zip templates.tpz

      - name: Vie selainversio
        run: |
          mkdir -p export/web
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --export-release "Web" export/web/index.html
          ls -la export/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
